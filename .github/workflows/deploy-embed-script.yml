name: "Deploy embed script"

on:
  push:
    branches:
      - main
    paths:
      - "packages/embeds/core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 8
      - name: Install dependencies & build
        run: pnpm --filter @dub/embed-core build

