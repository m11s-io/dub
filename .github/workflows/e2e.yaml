name: Public API Tests

on:
  deployment_status:

permissions:
  contents: read

jobs:
  api-tests:
    timeout-minutes: 30
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build utils
        working-directory: packages/utils
        run: pnpm build

      - name: Run tests
        working-directory: apps/web
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          E2E_TOKEN: ${{ secrets.E2E_TOKEN }}
          E2E_TOKEN_MEMBER: ${{ secrets.E2E_TOKEN_MEMBER }}
          E2E_TOKEN_OLD: ${{ secrets.E2E_TOKEN_OLD }}
          E2E_PUBLISHABLE_KEY: ${{ secrets.E2E_PUBLISHABLE_KEY }}
          QSTASH_URL: "https://qstash-us-east-1.upstash.io"
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          NEXT_PUBLIC_NGROK_URL: ${{ github.event.deployment_status.environment_url }}
          UNSUBSCRIBE_TOKEN_SECRET: "dummy-secret"
          VERCEL_ENV: ${{ github.event.deployment_status.environment }}
        run: pnpm test
